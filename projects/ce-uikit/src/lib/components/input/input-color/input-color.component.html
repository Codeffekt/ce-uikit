<ce-row [gap]="2"
        alignItems="center">
  <ce-container
                width="24px"
                height="24px"
                rounded
                #colorPicker
                ceColorPicker
                [ceColor]="value"
                [style.background-color]="value"
                (colorPicked)="onColorChanged($event)"
                (previewColor)="onPreviewColorChanged($event)"
                (colorStateChanges)="onStateChanges($event)"
                >
  </ce-container>
  <ce-text *ngIf="valueDisplayed">{{value}}</ce-text>
</ce-row>
